[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doe-optimization-toolkit"
version = "0.1.0"
description = "Industrial engineering design of experiments and response surface methodology: Full/Fractional Factorials, Alias Structures, Half-Normal Plots, CCD/Box-Behnken, and Quadratic Surface Optimization."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gabriel", email = "gabriel@example.com" }
]
keywords = [
    "design-of-experiments",
    "doe",
    "response-surface-methodology",
    "rsm",
    "central-composite-design",
    "box-behnken",
    "factorial-design",
    "industrial-engineering"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
pythonpath = ["src"]
